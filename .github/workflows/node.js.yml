name: Django CI

on:
  push:
    branches: [ "main", "146-fix-github-test-action" ]
  pull_request:
    branches: [ "main" ]

env:
  DJANGO_TEST_SERVER_PORT: 8004
  NODE_DEV_SERVER_PORT: 8006

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
    - uses: actions/checkout@v4

    - name: Install PL/Python in the PostgreSQL container (Old migrations)
      run: |
        docker exec ${{ job.services.postgres.id }} bash -c "apt-get update && apt-get install -y postgresql-plpython3-16"

    - name: Create PL/Python Extension
      run: |
        docker exec ${{ job.services.postgres.id }} bash -c "PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE EXTENSION plpython3u;'"
        docker exec ${{ job.services.postgres.id }} bash -c "PGPASSWORD=postgres createdb -h localhost -U postgres xulpymoney"

    - name: Wait for PostgreSQL
      run: |
        until PGPASSWORD=postgres pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL to become ready..."
          sleep 2
        done

    - name: Run E2E django_moneymoney test server from Docker
      run: |
        docker run -d \
          --name django_test_server \
          --network host \
          -e POSTGRES_HOST=127.0.0.1 \
          -e POSTGRES_PORT=5432 \
          -e POSTGRES_DB=xulpymoney \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e E2E_TESTING=1 \
          -e DJANGO_SETTINGS_MODULE=django_moneymoney.settings_docker \
          turulomio/django_moneymoney:latest \
          python manage.py testserver moneymoney/fixtures/all.json moneymoney/fixtures/test_server.json --addrport 0.0.0.0:${{ env.DJANGO_TEST_SERVER_PORT }} --noinput

    - name: Wait for Django test server
      run: |
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:${{ env.DJANGO_TEST_SERVER_PORT }}/ > /dev/null 2>&1; then
            echo "Django test server is ready and responding!"
            exit 0
          fi
          echo "Waiting for Django test server... ($i/30)"
          sleep 2
        done
        echo "Django test server failed to start. Logs:"
        docker logs django_test_server
        exit 1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Cache Node.js modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.node-version }}-

    - name: Moneymoney install and test build
      run: |
        npm install
        npm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Moneymoney e2e test
      run: |
        npm run playwright_console

    - name: Dump Django container logs on failure
      if: failure()
      run: |
        docker logs django_test_server
